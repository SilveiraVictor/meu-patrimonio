<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Patrimônio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1F4B">
<meta name="description" content="Controle de títulos de investimento e empréstimos pessoais">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Patrimônio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5FB;--card:#fff;--ink:#0B1F4B;--mut:#56627F;--line:#E1E6F2;--blue:#1F4FD8;--blue-s:#E8EEFF;--or:#FF7A1A;--or-s:#FFF0E3;--or-ink:#A84300;--ok:#157A46;--ok-s:#E1F5EA;--bad:#C42A31;--bad-s:#FCE7E8;--h1:#0B1F4B;--h2:#1F4FD8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1220;--card:#151D30;--ink:#EEF2FF;--mut:#9CA7C4;--line:#26304A;--blue:#7C98FF;--blue-s:#1B2750;--or:#FF8A33;--or-s:#3A2414;--or-ink:#FFB36B;--ok:#4CC98A;--ok-s:#14301F;--bad:#FF7A80;--bad-s:#3A1A1D;--h1:#14275E;--h2:#1F4FD8}}
:root[data-theme="dark"]{--bg:#0C1220;--card:#151D30;--ink:#EEF2FF;--mut:#9CA7C4;--line:#26304A;--blue:#7C98FF;--blue-s:#1B2750;--or:#FF8A33;--or-s:#3A2414;--or-ink:#FFB36B;--ok:#4CC98A;--ok-s:#14301F;--bad:#FF7A80;--bad-s:#3A1A1D;--h1:#14275E;--h2:#1F4FD8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.shell{max-width:440px;margin:0 auto;min-height:100vh;padding:20px 16px 150px}
h1{font-size:26px;line-height:1.15;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
h2{font-size:17px;margin:26px 0 10px;font-weight:700}
.sub{color:var(--mut);font-size:14px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.tap{width:100%;text-align:left;display:block}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.hero{background:linear-gradient(145deg,var(--h1),var(--h2));color:#fff;border:0;border-radius:24px;padding:22px}
.hero .big{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.04em;margin:10px 0 2px}
.hero small{opacity:.85;font-size:14px}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--blue-s);color:var(--blue);white-space:nowrap}
.chip.or{background:var(--or-s);color:var(--or-ink)}.chip.bad{background:var(--bad-s);color:var(--bad)}.chip.ok{background:var(--ok-s);color:var(--ok)}
.hero .chip{background:var(--or);color:#0B1F4B}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.grid .card{margin:0}.lbl{font-size:13px;color:var(--mut);font-weight:600}.num{font-size:21px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:var(--blue-s);color:var(--blue);flex:none}
.ico.or{background:var(--or-s);color:var(--or-ink)}
.t{font-weight:700;font-size:15.5px}.m{font-size:13.5px;color:var(--mut);margin-top:2px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.bar.or i{background:var(--or)}
.alert{background:var(--or-s);color:var(--or-ink);border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;min-height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--mut)}
nav button[aria-current=page]{color:var(--blue)}
nav svg,.fab svg,.back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 204px));height:56px;padding:0 20px 0 16px;border-radius:28px;border:0;background:var(--or);color:#0B1F4B;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(255,122,26,.35);z-index:5}
.btn{min-height:52px;width:100%;border-radius:16px;border:0;font-weight:800;font-size:16px;background:var(--or);color:#0B1F4B}
.btn.sec{background:var(--blue-s);color:var(--blue)}.btn:disabled{opacity:.45;cursor:not-allowed}
.back{background:none;border:0;display:flex;align-items:center;gap:4px;color:var(--blue);font-weight:700;min-height:44px;padding:0;margin-bottom:6px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;background:none;border-radius:11px;font-weight:700;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.f{margin-bottom:14px}.f label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.f input,.f select{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
.f small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin-bottom:12px;font-weight:700}
.sw button{width:54px;height:32px;border-radius:16px;border:0;background:var(--line);position:relative;flex:none}
.sw button[aria-checked=true]{background:var(--blue)}
.sw button i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw button[aria-checked=true] i{transform:translateX(22px)}
.pv{background:var(--blue-s);border-radius:16px;padding:14px;margin:6px 0 16px;font-size:14px}
.pv div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.pv b{font-weight:800}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}.kv div:last-child{border:0}.kv span{color:var(--mut)}.kv b{text-align:right}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btn.dg{background:var(--bad);color:var(--bg)}
.paper{background:#fff;color:#1b2440;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin:0 0 14px}.ph{background:#0B1F4B;color:#fff;padding:16px;border-bottom:4px solid #FF7A1A}.ph b{display:block;font-size:18px}.ph span{font-size:13px;opacity:.85}
.hb{margin:14px 16px 0;background:#E8EEFF;border-radius:14px;padding:14px 16px}.hb span{display:block;font-size:13px;color:#4a5878;font-weight:600}.hb b{font-size:28px;color:#0B1F4B;font-weight:800}
.pn{margin:14px 16px 4px;font-size:14px;line-height:1.5}.pk{padding:6px 16px}.pk div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #e1e6f2;font-size:14px}.pk span{color:#5b6785}.pk b{text-align:right}
.paper th,.paper td{border-color:#e1e6f2;color:#1b2440}.paper th{color:#5b6785}.paper .sc{padding:0 8px}.sg{margin:34px 16px 6px;border-top:1px solid #1b2440;padding-top:6px;font-size:12.5px;color:#5b6785;text-align:center}.pf{padding:10px 16px 14px;font-size:12px;color:#8a94ad;text-align:center}
@media print{.shell,nav,.fab,#bd,#toast,#sh .noprint,#sh .grab{display:none!important}#sh{position:static!important;transform:none!important;width:100%!important;max-height:none!important;overflow:visible!important;background:#fff!important;padding:0!important;display:block!important}.paper{border:0}body{background:#fff}}
#bd{position:fixed;inset:0;background:rgba(5,10,30,.55);z-index:10;display:none}
#sh{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(440px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:11;display:none}
#sh .grab{width:44px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 12px}
.sheetH{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheetH h2{margin:0;font-size:20px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--line);font-size:18px}
.step{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 14px}
.step button{width:52px;height:52px;border-radius:50%;border:0;background:var(--blue-s);color:var(--blue);font-size:26px;font-weight:700}
.step b{font-size:34px;min-width:60px;text-align:center}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--blue-s)}
.sc{overflow-x:auto;border-radius:14px}table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:340px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:700;font-size:12.5px}tr.done td{opacity:.5}tr.nx td{background:var(--or-s);font-weight:800}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:20;display:none;align-items:center;gap:14px;max-width:92%}
#toast button{background:none;border:0;color:var(--or);font-weight:800;min-height:36px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<button class="fab" id="fab" aria-label="Adicionar"></button>
<nav id="nav" aria-label="Navegação principal"></nav>
<div id="bd"></div><div id="sh" role="dialog" aria-modal="true"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'2-digit'}).replace(/\./g,'');
const addM=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+m);return x};
const T=new Date();T.setHours(0,0,0,0);
const D=n=>new Date(T.getTime()+n*864e5);
const days=d=>Math.round((d-T)/864e5);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const sumJ=r=>r.reduce((a,x)=>a+x.j,0);
const ic={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',inv:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',loans:'<path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ic[n]}</svg>`;

function gen(B,n,i,sys,start){const r=[];let b=B;const A=B/n,P=i>0?B*i/(1-Math.pow(1+i,-n)):B/n;
 for(let k=0;k<n;k++){const j=b*i;let am=sys==='sac'?A:P-j;if(k===n-1)am=b;b=Math.max(0,b-am);r.push({due:addM(start,k),am,j,pm:am+j,bal:b})}return r}
const rows=l=>l.n>0?gen(l.bal,l.n,l.i,l.sys,l.next):[];
function mk(who,total,i,sys,n,start,desc){return{id:Math.random(),who,total,i,sys,bal:total,n,next:start,desc:desc||'',paid:[],log:[]}}
function pay(l){const r=rows(l)[0];l.paid.push({...r,k:l.paid.length+1,paidOn:new Date()});l.bal=r.bal;l.n--;l.next=addM(l.next,1)}

const S={tab:'home',loan:null,iv:null,inv:[
 {id:1,banco:'Tesouro Nacional',tipo:'Tesouro Direto',idx:'ipca',taxa:6.2,v:12000,ini:D(-420),fim:D(18)},
 {id:2,banco:'Banco Azul',tipo:'CDB',idx:'cdi',taxa:112,v:5000,ini:D(-200),fim:D(95)},
 {id:3,banco:'Banco Horizonte',tipo:'LCI',idx:'pre',taxa:11.8,v:8000,ini:D(-60),fim:D(240)}],loans:[]};
{const a=mk('Carlos Menezes',6000,.015,'price',10,addM(T,-2),'Caixa de som comprada no meu cartão de crédito');pay(a);pay(a);pay(a);
 const b=mk('Mariana Souza',2400,0,'none',6,addM(T,-1));pay(b);pay(b);
 const c=mk('João Pereira',3000,.02,'sac',5,D(-5),'Reforma da cozinha');S.loans.push(a,b,c);S.loans.forEach(l=>l.paid.forEach(p=>p.paidOn=p.due));S.inv.forEach(x=>x.demo=1);S.loans.forEach(l=>l.demo=1)}

const status=l=>l.n===0?['Quitado','ok']:l.next<T?[`${-days(l.next)}d em atraso`,'bad']:[days(l.next)===0?'Vence hoje':'Em dia','blue'];
function dl(d){const n=days(d);return n<0?[`${-n}d em atraso`,'bad']:n===0?['Hoje','or']:n===1?['Amanhã','or']:[`em ${n} dias`,n<=30?'or':'blue']}
const sysName={none:'Sem juros',price:'Price',sac:'SAC'};
const totP=l=>l.paid.length+l.n;

function render(){
 const f=$('#fab');f.hidden=!!(S.loan||S.iv);
 f.innerHTML=svg('plus')+(S.tab==='inv'?'Novo título':S.tab==='loans'?'Novo empréstimo':'Adicionar');
 $('#nav').innerHTML=[['home','Início'],['inv','Investimentos'],['loans','Empréstimos']].map(([k,t])=>`<button ${S.tab===k&&!S.loan&&!S.iv?'aria-current="page"':''} onclick="go('${k}')">${svg(k)}${t}</button>`).join('');
 $('#app').innerHTML=S.iv?invDetail(S.inv.find(x=>x.id===S.iv)):S.loan?detail(S.loans.find(x=>x.id===S.loan)):S.tab==='home'?home():S.tab==='inv'?invView():loansView();
 save();drawInstall();scrollTo(0,0)}
const go=t=>{S.tab=t;S.loan=null;S.iv=null;render()};
const openInv=id=>{S.iv=id;S.tab='inv';render()};
const openLoan=id=>{S.loan=id;S.tab='loans';render()};

function home(){
 const iv=[...S.inv].sort((a,b)=>a.fim-b.fim),n=iv[0],[txt,tone]=n?dl(n.fim):['',''];
 const act=S.loans.filter(l=>l.n>0),od=act.filter(l=>l.next<T);
 const mo=act.filter(l=>l.next.getMonth()===T.getMonth()&&l.next.getFullYear()===T.getFullYear()||l.next<T).reduce((a,l)=>a+rows(l)[0].pm,0);
 const open=act.reduce((a,l)=>a+l.bal,0);
 const items=[...S.inv.map(x=>({d:x.fim,k:'inv',id:x.id,t:nm(x),m:'Vencimento do título · '+brl(x.v)})),...act.map(l=>({d:l.next,k:'loan',id:l.id,t:'Parcela de '+l.who.split(' ')[0],m:`${l.paid.length+1}/${totP(l)} · ${brl(rows(l)[0].pm)}`}))].sort((a,b)=>a.d-b.d).slice(0,6);
 return `<h1>Meu Patrimônio</h1><p class="sub">O que vence e o que você tem a receber.</p>${demoBanner()}<div id="ins"></div>
 ${od.length?`<div class="alert">⚠️ ${od.length} parcela atrasada: ${od.map(l=>l.who.split(' ')[0]).join(', ')}</div>`:''}
 ${n?`<div class="card hero"><small>Próximo vencimento de título</small><div class="big">${days(n.fim)}<span style="font-size:24px;font-weight:700"> dias</span></div>
 <div class="row" style="justify-content:space-between;margin-top:10px"><div><b>${nm(n)}</b><br><small>${fd(n.fim)} · ${brl(n.v)}</small></div>${tone==='or'?'<span class="chip">Atenção</span>':''}</div></div>`:empty('Nenhum título cadastrado','Adicionar título','invSheet()')}
 <div class="grid"><div class="card"><div class="lbl">A receber este mês</div><div class="num">${brl(mo)}</div></div><div class="card"><div class="lbl">Emprestado em aberto</div><div class="num">${brl(open)}</div></div></div>
 <h2>Próximos vencimentos</h2>${items.length?'':'<p class="m">Nada por aqui ainda. Use o botão laranja para adicionar.</p>'}
 ${items.map(x=>{const[t,c]=dl(x.d);return `<button class="card tap row" onclick="${x.k==='inv'?`openInv(${x.id})`:`openLoan(${x.id})`}"><div class="ico ${x.k==='loan'?'or':''}">${x.k==='inv'?'T':x.t.split(' ')[2][0]}</div><div class="grow"><div class="t">${x.t}</div><div class="m">${x.m}</div></div><div style="text-align:right"><span class="chip ${c}">${t}</span><div class="m">${fd(x.d)}</div></div></button>`}).join('')}${dataCard()}`}

const nm=x=>x.tipo+' '+x.banco;
const fmt=n=>n.toLocaleString('pt-BR',{maximumFractionDigits:2});
const ind={cdi:13.9,selic:14,ipca:4.22};
const IDX={pre:'Prefixado',cdi:'% do CDI',ipca:'IPCA +',selic:'Selic +'};
const ISENTO=['LCI','LCA','CRI','CRA'];
const prazo=x=>Math.round((x.fim-x.ini)/864e5);
const aliq=x=>{if(ISENTO.includes(x.tipo))return 0;const p=prazo(x);return p<=180?.225:p<=360?.2:p<=720?.175:.15};
const rateAA=x=>x.idx==='pre'?x.taxa/100:x.idx==='cdi'?ind.cdi*x.taxa/1e4:x.idx==='ipca'?(1+ind.ipca/100)*(1+x.taxa/100)-1:ind.selic/100+x.taxa/100;
function calc(x){const p=prazo(x),r=rateAA(x),b=x.v*Math.pow(1+r,p/365)-x.v,a=aliq(x),ir=b*a;return{p,r,b,a,ir,l:b-ir,fb:x.v+b,fl:x.v+b-ir}}
const taxaTxt=x=>x.idx==='pre'?fmt(x.taxa)+'% a.a.':x.idx==='cdi'?fmt(x.taxa)+'% do CDI':x.idx==='ipca'?'IPCA + '+fmt(x.taxa)+'% a.a.':'Selic + '+fmt(x.taxa)+'% a.a.';
const irTxt=c=>c.a?`IR ${fmt(c.a*100)}%`:'Isento de IR';
const kv=(a,b)=>`<div><span>${a}</span><b>${b}</b></div>`;

function invView(){
 const tot=S.inv.reduce((a,x)=>a+x.v,0),liq=S.inv.reduce((a,x)=>a+calc(x).fl,0);
 return `<h1>Investimentos</h1><p class="sub">Aplicado: <b>${brl(tot)}</b> · Líquido no vencimento: <b>${brl(liq)}</b></p>
 <div class="card"><div class="row" style="justify-content:space-between"><b>Indicadores de referência</b><button class="chip" style="border:0;min-height:44px;padding:0 16px" onclick="indSheet()">Editar</button></div>
 <div class="three"><div><div class="lbl">CDI</div><div class="t">${fmt(ind.cdi)}%</div></div><div><div class="lbl">Selic</div><div class="t">${fmt(ind.selic)}%</div></div><div><div class="lbl">IPCA 12m</div><div class="t">${fmt(ind.ipca)}%</div></div></div>
 <div class="m" style="margin-top:10px">Referência de ago/2026. As estimativas supõem que o indicador se mantém até o vencimento.</div></div>`+
 [...S.inv].sort((a,b)=>a.fim-b.fim).map(x=>{const c=calc(x),[t,cl]=dl(x.fim),pre=x.idx==='pre',p=Math.min(100,Math.max(0,(T-x.ini)/(x.fim-x.ini)*100));
 return `<button class="card tap" onclick="openInv(${x.id})"><div class="row"><div class="ico">${x.tipo[0]}</div><div class="grow"><div class="t">${x.banco}</div><div class="m">${x.tipo} · ${taxaTxt(x)}</div></div><span class="chip ${cl}">${t}</span></div>

 <div class="f"><label for="f-c">Descrição (opcional)</label><input id="f-c" maxlength="140" placeholder="Ex.: Caixa de som comprada no meu cartão"><small>Anote o motivo ou o que foi comprado.</small></div>

/* antecipar / amortizar */
const A={tab:'ant',n:1,mode:'prazo',val:''};let AL=null;
function amSim(l,amt,mode,fn){const B=l.bal-amt,r0=rows(l);
 if(B<=.005)return{n:0,r:[],pm:0,eco:sumJ(r0)};let n=l.n;
 if(fn!==undefined)n=fn;else if(mode==='prazo')n=l.sys==='sac'?Math.ceil(B/r0[0].am-1e-6):l.i>0?Math.ceil(-Math.log(1-B*l.i/r0[0].pm)/Math.log(1+l.i)-1e-6):Math.ceil(B/r0[0].pm-1e-6);
 n=Math.max(1,n);const r=gen(B,n,l.i,l.sys,l.next);return{n,r,pm:r[0].pm,eco:sumJ(r0)-sumJ(r)}}
function amSheet(id){AL=S.loans.find(x=>x.id==id);A.tab='ant';A.n=1;A.mode='prazo';A.val='';amDraw();}
function amCalc(){const l=AL;if(A.tab==='ant'){const r0=rows(l),amt=r0.slice(-A.n).reduce((a,x)=>a+x.am,0);return{amt,s:amSim(l,amt,'prazo',l.n-A.n)}}
 const amt=Math.min(+A.val||0,l.bal);return{amt,s:amt>0?amSim(l,amt,A.mode):null}}
function amDraw(){const l=AL,{amt,s}=amCalc();
 openSheet(hd('Antecipar ou amortizar')+`<div class="seg" style="margin-bottom:16px"><button aria-pressed="${A.tab==='ant'}" onclick="A.tab='ant';amDraw()">Antecipar parcelas</button><button aria-pressed="${A.tab==='val'}" onclick="A.tab='val';amDraw()">Amortizar valor</button></div>
 ${A.tab==='ant'?`<p class="sub" style="margin-bottom:6px">Quite as últimas parcelas agora, sem pagar os juros delas.</p><div class="step"><button aria-label="Menos" onclick="A.n=Math.max(1,A.n-1);amDraw()">−</button><b>${A.n}</b><button aria-label="Mais" onclick="A.n=Math.min(AL.n,A.n+1);amDraw()">+</button></div><p class="m" style="text-align:center;margin-top:-6px">parcela${A.n>1?'s':''} de ${l.n} restantes</p>`
 :`<div class="f"><label for="a-v">Valor a abater (R$)</label><input id="a-v" type="number" inputmode="decimal" min="0" max="${l.bal.toFixed(2)}" step="any" value="${A.val}" oninput="A.val=this.value;amPv()"><small>Saldo devedor: ${brl(l.bal)}</small></div>
 <button class="opt" aria-pressed="${A.mode==='prazo'}" onclick="A.mode='prazo';amDraw()"><div class="t">Reduzir o prazo</div><div class="m">Mantém a parcela e termina antes.</div></button>
 <button class="opt" aria-pressed="${A.mode==='parcela'}" onclick="A.mode='parcela';amDraw()"><div class="t">Reduzir a parcela</div><div class="m">Mantém o prazo e diminui o valor.</div></button>`}
 <div class="pv" id="apv"></div><button class="btn" id="a-s" onclick="amDo()">${A.tab==='ant'?'Confirmar antecipação':'Confirmar amortização'}</button>`);amPv()}
function amPv(){const{amt,s}=amCalc();$('#a-s').disabled=!(amt>0);
 $('#apv').innerHTML=!s?'Informe um valor para ver o efeito.':`<div><span>Você paga agora</span><b>${brl(amt)}</b></div>`+(s.n?`<div><span>Nova parcela</span><b>${brl(s.pm)}</b></div><div><span>Parcelas restantes</span><b>${s.n}</b></div>`:`<div><span>Resultado</span><b>Quitado</b></div>`)+(s.eco>0.005?`<div><span>Juros economizados</span><b style="color:var(--ok)">${brl(s.eco)}</b></div>`:'')}
function amDo(){const l=AL,{amt,s}=amCalc();undoSnap=structuredClone(S.loans);
 l.log.push({t:A.tab==='ant'?`Antecipou ${A.n} parcela${A.n>1?'s':''}`:`Amortizou (${A.mode==='prazo'?'reduziu prazo':'reduziu parcela'})`,d:new Date(),v:amt,eco:s.eco});
 l.bal=s.n?l.bal-amt:0;l.n=s.n;closeSheet();render();toast(s.n?'Atualizado. Cronograma recalculado':'Empréstimo quitado',1)}
/* comprovantes */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdl=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
const R={tab:'status',sel:0,me:''};let RL_=null;
const recItems=l=>[...l.paid.map(p=>({k:'p',d:p.paidOn||p.due,v:p.pm,p})),...l.log.map(g=>({k:'g',d:g.d,v:g.v,g}))].sort((a,b)=>a.d-b.d);
function mkDoc(){const l=RL_,tot=totP(l),fut=rows(l),me=R.me.trim(),base=[['Devedor',l.who]];if(me)base.unshift(['Credor',me]);
 if(R.tab==='rec'){const it=recItems(l)[R.sel];if(!it)return null;const isP=it.k==='p';
  return{title:'Recibo de pagamento',sub:'Emitido em '+fdl(new Date()),sign:true,hero:{label:'Valor recebido',value:brl(it.v)},
   note:`Recebi de ${l.who} a quantia de ${brl(it.v)}, referente a ${isP?'parcela '+it.p.k+' de '+tot:it.g.t.toLowerCase()} do empréstimo${l.desc?' "'+l.desc+'"':''}.`,
   rows:[...base,['Data do recebimento',fdl(it.d)],...(isP?[['Vencimento da parcela',fdl(it.p.due)],['Amortização do principal',brl(it.p.am)],['Juros',brl(it.p.j)],['Saldo devedor após o pagamento',brl(it.p.bal)]]:it.g.eco>0.005?[['Juros economizados',brl(it.g.eco)]]:[])]}}
 const pg=l.paid.reduce((a,x)=>a+x.pm,0)+l.log.reduce((a,x)=>a+x.v,0),rest=fut.reduce((a,x)=>a+x.pm,0);
 const body=[...l.paid.map(x=>[String(x.k),fd(x.due),brl(x.pm),'Paga']),...l.log.map(g=>[(/^Antecipou/.test(g.t)?'Antec.':'Amort.'),fd(g.d),brl(g.v),'Paga']),...fut.map((x,k)=>[String(l.paid.length+k+1),fd(x.due),brl(x.pm),x.due<T?'Atrasada':'A vencer'])];
 return{title:'Comprovante de status',sub:'Posição em '+fdl(new Date()),note:l.desc,hero:fut.length?{label:'Valor a pagar',value:brl(rest)}:{label:'Situação',value:'Quitado'},
  rows:[...base,...(l.i>0?[['Valor emprestado',brl(l.total)]]:[]),[l.i>0?'Valor total (com juros)':'Valor total',brl(pg+rest)],['Valor pago',brl(pg)],['Parcelas pagas',l.paid.length+' de '+tot],['Sistema',sysName[l.sys]+(l.i?' · '+fmt(l.i*100)+'% a.m.':'')],...(fut.length?[['Próximo vencimento',fd(l.next)+' · '+brl(fut[0].pm)]]:[])],

async function saveFile(name,data){let dl=null;try{dl=typeof claude!=='undefined'?await claude.use('downloads'):null}catch(e){}

const K='mp:v1';

function save(){try{localStorage.setItem(K,JSON.stringify({v:1,inv:S.inv,loans:S.loans,ind,me:R.me}));S.ok=true}catch(e){S.ok=false}}

const empty=(t,b,fn)=>`<div class="card" style="text-align:center"><div class="t">${t}</div><div class="m" style="margin:4px 0 14px">Toque para começar.</div><button class="btn sec" onclick="${fn}">${b}</button></div>`;

const askClear=()=>confirmSheet('Apagar exemplos?','Os títulos e empréstimos de exemplo serão removidos. O que você cadastrou continua aqui.','Apagar exemplos','clearDemo()',1);
